<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f3f">
<title>Grove · RAG Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #eef5ec; --bg-2: #dcebd8;
    --ink: #17261c; --ink-soft: #4f6355; --ink-faint: #7d8f81;
    --brand: #2f7d4f; --brand-strong: #1f5f3f; --brand-soft: #e1f0e2;
    --glass: rgba(255, 255, 255, .62); --glass-strong: rgba(255, 255, 255, .82);
    --line: rgba(31, 95, 63, .14);
    --user-1: #2f7d4f; --user-2: #3f9963;
    --leaf-1: #2f7d4f; --leaf-2: #4f9f5f; --leaf-3: #7fbf6a; --bark: #4a3b2c;
    --tree-opacity: .2;
    --shadow: 0 10px 30px -12px rgba(23, 60, 38, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #0d1a13; --bg-2: #13261b;
      --ink: #e4efe6; --ink-soft: #a9bfae; --ink-faint: #7a907f;
      --brand: #5cbf7f; --brand-strong: #8fd9a6; --brand-soft: rgba(92, 191, 127, .14);
      --glass: rgba(20, 38, 28, .6); --glass-strong: rgba(24, 46, 33, .85);
      --line: rgba(143, 217, 166, .14);
      --user-1: #2f7d4f; --user-2: #3c8f5c;
      --leaf-1: #3f9963; --leaf-2: #5cbf7f; --leaf-3: #9ad98a; --bark: #8a7357;
      --tree-opacity: .16;
      --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; height: 100dvh; overflow: hidden;
    font: 15px/1.55 Inter, system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink);
    background:
      radial-gradient(1200px 700px at 85% 110%, var(--bg-2), transparent 60%),
      radial-gradient(900px 600px at 0% -10%, var(--bg-2), transparent 55%),
      var(--bg-1);
  }
  button, select, textarea { font: inherit; color: inherit; }

  /* ---------- background tree ---------- */
  #scenery { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #tree {
    position: absolute; right: -4vw; bottom: -2vh; height: min(98vh, 900px); width: auto;
    opacity: var(--tree-opacity); filter: blur(.3px);
  }
  #tree .trunk { fill: var(--bark); }
  #tree .limb { fill: none; stroke: var(--bark); stroke-linecap: round; }
  #tree .leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: flutter var(--d, 3s) ease-in-out var(--delay, 0s) infinite alternate; }
  #tree .sway { transform-box: view-box; animation: sway var(--d, 7s) ease-in-out var(--delay, 0s) infinite alternate; }
  #canopy { transform-box: view-box; transform-origin: 300px 800px; animation: breeze 11s ease-in-out infinite alternate; }
  @keyframes breeze  { from { transform: rotate(-.6deg); } to { transform: rotate(.9deg); } }
  @keyframes sway    { from { transform: rotate(calc(var(--a, 2deg) * -1)); } to { transform: rotate(var(--a, 2deg)); } }
  @keyframes flutter { from { transform: rotate(calc(var(--r, 0deg) - 9deg)) scale(1); } to { transform: rotate(calc(var(--r, 0deg) + 9deg)) scale(.94); } }

  .falling {
    position: absolute; top: -40px; width: 16px; height: 22px; opacity: 0;
    animation: fall var(--d, 16s) linear var(--delay, 0s) infinite;
  }
  .falling svg { width: 100%; height: 100%; fill: var(--leaf-2); animation: spin 3.2s ease-in-out infinite alternate; }
  @keyframes fall {
    0%   { transform: translate(0, 0); opacity: 0; }
    8%   { opacity: .35; }
    50%  { transform: translate(var(--x1, -60px), 55vh); }
    90%  { opacity: .3; }
    100% { transform: translate(var(--x2, 40px), 108vh); opacity: 0; }
  }
  @keyframes spin { from { transform: rotate(-40deg); } to { transform: rotate(50deg) scaleX(.6); } }

  @media (prefers-reduced-motion: reduce) {
    #tree *, #canopy, .falling, .falling svg { animation: none !important; }
    .falling { display: none; }
  }

  /* ---------- sidebar ---------- */
  aside {
    position: relative; z-index: 3; width: 272px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    border-right: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 6px; }
  .brand svg { width: 30px; height: 30px; flex-shrink: 0; }
  .brand b { font: 600 21px/1 Fraunces, Georgia, serif; letter-spacing: -.01em; color: var(--brand-strong); }
  .brand small { display: block; font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
  button.new {
    margin: 14px 14px 8px; padding: 11px 14px; border: 0; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, var(--user-1), var(--user-2)); box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button.new:hover { transform: translateY(-1px); }
  .section-label { padding: 12px 20px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  #chats { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
  .chat-item {
    padding: 9px 10px 9px 12px; margin: 2px 0; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; color: var(--ink-soft);
    transition: background .15s ease, color .15s ease;
  }
  .chat-item:hover { background: var(--brand-soft); color: var(--ink); }
  .chat-item.active { background: var(--brand-soft); color: var(--brand-strong); font-weight: 500; box-shadow: inset 3px 0 0 var(--brand); }
  .chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del { border: 0; background: none; color: var(--ink-faint); cursor: pointer; opacity: 0; padding: 2px 6px; border-radius: 6px; transition: opacity .15s; }
  .chat-item:hover .del, .chat-item.active .del { opacity: 1; }
  .chat-item .del:hover { color: #c0392b; background: rgba(192, 57, 43, .1); }
  .no-chats { padding: 8px 12px; font-size: 13px; color: var(--ink-faint); }

  /* ---------- main ---------- */
  main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header.top { display: none; }
  #messages { flex: 1; overflow-y: auto; padding: 28px 20px 12px; scroll-behavior: smooth; }
  .msg {
    max-width: 780px; margin: 0 auto 16px; padding: 13px 16px; border-radius: 18px;
    white-space: pre-wrap; overflow-wrap: anywhere; animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .assistant { white-space: normal; }
  .assistant h4 { margin: .8em 0 .3em; font-size: 15px; color: var(--brand-strong); }
  .assistant p { margin: 0 0 .5em; } .assistant ul, .assistant ol { margin: .2em 0 .6em; padding-left: 1.3em; } .assistant li { margin: .2em 0; }
  .user {
    width: fit-content; max-width: min(620px, 88%); margin-right: max(0px, calc((100% - 780px) / 2));
    margin-left: auto; color: #fff; border-bottom-right-radius: 6px;
    background: linear-gradient(135deg, var(--user-1), var(--user-2)); box-shadow: var(--shadow);
  }
  .assistant {
    background: var(--glass-strong); border: 1px solid var(--line); border-bottom-left-radius: 6px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; white-space: normal; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-strong); }
  details { font-size: 13px; margin-top: 10px; color: var(--ink-soft); white-space: normal; }
  details summary { cursor: pointer; font-weight: 600; color: var(--brand-strong); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "›"; display: inline-block; transition: transform .2s; font-size: 16px; line-height: 1; }
  details[open] summary::before { transform: rotate(90deg); }
  .src { margin: 8px 0 0; padding: 9px 12px; border-radius: 10px; border-left: 3px solid var(--brand); background: var(--brand-soft); }
  .src b { color: var(--ink); }
  .src em { font-style: normal; color: var(--ink-faint); font-size: 12px; }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); animation: bounce 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }
  .error { color: #b03a2e; }

  .empty { max-width: 620px; margin: 12vh auto 0; text-align: center; animation: rise .5s ease both; }
  .empty svg { width: 62px; height: 62px; }
  .empty h1 { font: 600 clamp(26px, 4vw, 36px)/1.15 Fraunces, Georgia, serif; margin: 14px 0 8px; color: var(--brand-strong); letter-spacing: -.015em; }
  .empty p { color: var(--ink-soft); margin: 0 0 22px; }
  .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
  .suggestions button {
    padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; font-size: 14px; color: var(--ink-soft);
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .suggestions .skeleton {
    height: 48px; border-radius: 14px; border: 1px solid var(--line);
    background: linear-gradient(90deg, var(--glass) 0%, var(--brand-soft) 50%, var(--glass) 100%); background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .library { margin-top: 26px; }
  .library h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px; }
  .library ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .library li { font-size: 12.5px; padding: 4px 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); color: var(--ink-soft); }
  .library li em { font-style: normal; color: var(--ink-faint); }
  .suggestions button:hover { transform: translateY(-2px); border-color: var(--brand); color: var(--ink); }

  /* ---------- composer ---------- */
  form {
    display: flex; align-items: flex-end; gap: 8px; width: min(820px, calc(100% - 24px)); margin: 6px auto 16px;
    padding: 8px 8px 8px 16px; border-radius: 22px; border: 1px solid var(--line);
    background: var(--glass-strong); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  form:focus-within { border-color: var(--brand); box-shadow: var(--shadow), 0 0 0 4px var(--brand-soft); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; padding: 9px 0; max-height: 180px; line-height: 1.45; }
  textarea::placeholder { color: var(--ink-faint); }
  select {
    height: 40px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--brand-soft);
    color: var(--brand-strong); font-size: 13px; cursor: pointer; outline: 0;
  }
  form button.send {
    width: 42px; height: 40px; flex-shrink: 0; border: 0; border-radius: 12px; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--user-1), var(--user-2)); color: #fff; transition: transform .15s, opacity .15s;
  }
  form button.send:hover { transform: scale(1.05); }
  form button.send:disabled { opacity: .5; cursor: default; transform: none; }
  .hint { text-align: center; font-size: 11.5px; color: var(--ink-faint); margin: -8px 0 10px; }

  #backdrop { display: none; }

  /* ---------- small screens ---------- */
  @media (max-width: 760px) {
    aside {
      position: fixed; inset: 0 auto 0 0; width: min(84vw, 300px); transform: translateX(-102%);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1); background: var(--glass-strong); box-shadow: var(--shadow);
    }
    body.drawer aside { transform: none; }
    #backdrop { display: block; position: fixed; inset: 0; z-index: 2; background: rgba(10, 30, 18, .35); opacity: 0; pointer-events: none; transition: opacity .25s; }
    body.drawer #backdrop { opacity: 1; pointer-events: auto; }
    header.top {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    header.top button { border: 0; background: none; padding: 6px; border-radius: 10px; cursor: pointer; color: var(--brand-strong); display: grid; place-items: center; }
    header.top b { font: 600 19px/1 Fraunces, Georgia, serif; color: var(--brand-strong); flex: 1; }
    #messages { padding: 18px 12px 8px; }
    .msg { padding: 11px 14px; }
    .user { max-width: 92%; }
    .empty { margin-top: 6vh; }
    .suggestions { grid-template-columns: 1fr; }
    form { flex-wrap: wrap; width: calc(100% - 16px); margin-bottom: max(10px, env(safe-area-inset-bottom)); padding: 8px; border-radius: 18px; }
    textarea { flex-basis: 100%; padding: 6px 8px; }
    select { flex: 1; }
    .hint { display: none; }
    #tree { right: -30vw; height: 80vh; --tree-opacity: .14; }
  }
</style>
</head>
<body>

<div id="scenery" aria-hidden="true">
  <svg id="tree" viewBox="0 0 600 800" preserveAspectRatio="xMidYMax meet"></svg>
</div>

<aside id="sidebar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--brand-soft)"/><path d="M16 26V14" stroke="var(--bark)" stroke-width="2" stroke-linecap="round"/><path d="M16 15c-5 0-8-3-8-8 5 0 8 3 8 8Zm0 2c4 0 7-2.5 7-7-4 0-7 2.5-7 7Z" fill="var(--brand)"/></svg>
    <div><b>Grove</b><small id="tagline">Answers grounded in your PDFs</small></div>
  </div>
  <button class="new" onclick="newChat()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <div class="section-label">Recent</div>
  <div id="chats"></div>
</aside>
<div id="backdrop" onclick="toggleDrawer(false)"></div>

<main>
  <header class="top">
    <button onclick="toggleDrawer(true)" aria-label="Open chats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <b>Grove</b>
    <button onclick="newChat()" aria-label="New chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <div id="messages"></div>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask anything about your documents…"></textarea>
    <select id="mode" title="Query rewriting (more accurate, slower)"><option value="none">Fast</option></select>
    <button class="send" type="submit" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="hint">Enter to send · Shift + Enter for a new line</div>
</main>

<script>
/* ---------- animated tree (decorative) ---------- */
(function buildTree() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('tree');
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent && parent.appendChild(n);
    return n;
  };
  const LEAF = 'M0 0C7-6 8-17 0-26C-8-17-7-6 0 0Z';
  const leafFills = ['var(--leaf-1)', 'var(--leaf-2)', 'var(--leaf-3)'];

  function leaves(parent, cx, cy, n, spread) {
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * spread;
      const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * .75;
      const g = el('g', {transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(.7 + rand() * .7).toFixed(2)})`}, parent);
      const p = el('path', {d: LEAF, class: 'leaf', fill: leafFills[(rand() * 3) | 0], 'fill-opacity': (.65 + rand() * .35).toFixed(2)}, g);
      p.style.setProperty('--r', `${((rand() - .5) * 140).toFixed(0)}deg`);
      p.style.setProperty('--d', `${(2.2 + rand() * 2.6).toFixed(2)}s`);
      p.style.setProperty('--delay', `${(-rand() * 4).toFixed(2)}s`);
    }
  }

  // trunk
  el('path', {class: 'trunk', d: 'M272 800C280 700 286 610 290 520C293 470 296 440 300 410L312 412C314 450 316 490 318 540C322 620 330 710 340 800Z'}, svg);
  el('path', {class: 'trunk', d: 'M272 800C250 792 230 796 212 800H360C346 796 334 792 340 800Z', opacity: .8}, svg);

  const canopy = el('g', {id: 'canopy'}, svg);
  // [origin x, y, limb path, stroke width, sway angle, duration, leaf clusters [x, y, count, spread]]
  const limbs = [
    [296, 540, 'M296 540C250 500 200 470 140 430C110 410 92 380 86 350', 16, 2.2, 7.5, [[86, 340, 22, 60], [150, 420, 14, 46], [200, 470, 10, 36]]],
    [304, 500, 'M304 500C350 470 400 440 450 400C480 375 500 350 512 320', 15, 2.6, 8.4, [[512, 310, 22, 62], [440, 400, 14, 44]]],
    [300, 440, 'M300 440C280 380 250 320 220 270C205 245 195 220 190 190', 12, 2.0, 6.8, [[190, 180, 22, 62], [235, 295, 12, 40]]],
    [306, 430, 'M306 430C330 370 360 310 390 260C405 235 415 205 418 175', 12, 2.4, 7.2, [[418, 165, 22, 62], [370, 300, 12, 40]]],
    [304, 415, 'M304 415C302 340 300 260 302 180C303 140 306 110 310 80', 10, 1.6, 9.2, [[310, 80, 26, 70], [300, 200, 14, 50]]],
    [292, 600, 'M292 600C250 585 210 575 170 580', 8, 3.2, 5.8, [[160, 575, 14, 40]]],
    [316, 620, 'M316 620C360 600 400 595 440 600', 8, 3.4, 6.2, [[452, 595, 14, 40]]],
  ];
  for (const [ox, oy, d, w, a, dur, clusters] of limbs) {
    const g = el('g', {class: 'sway'}, canopy);
    g.style.transformOrigin = `${ox}px ${oy}px`;
    g.style.setProperty('--a', `${a}deg`);
    g.style.setProperty('--d', `${dur}s`);
    g.style.setProperty('--delay', `${(-rand() * dur).toFixed(2)}s`);
    el('path', {class: 'limb', d, 'stroke-width': w}, g);
    for (const [x, y, n, s] of clusters) leaves(g, x, y, n, s);
  }

  // a few leaves drifting down across the page
  const scenery = document.getElementById('scenery');
  for (let i = 0; i < 6; i++) {
    const f = document.createElement('div');
    f.className = 'falling';
    f.style.left = `${10 + rand() * 85}%`;
    f.style.setProperty('--d', `${14 + rand() * 12}s`);
    f.style.setProperty('--delay', `${-rand() * 20}s`);
    f.style.setProperty('--x1', `${(rand() - .5) * 160}px`);
    f.style.setProperty('--x2', `${(rand() - .5) * 220}px`);
    f.innerHTML = `<svg viewBox="-10 -28 20 30"><path d="${LEAF}"/></svg>`;
    scenery.appendChild(f);
  }
})();

/* ---------- chat ---------- */
let chatId = null;
const $ = id => document.getElementById(id);
// Minimal Markdown for answers (bold, ### headings, bullet and numbered lists); input is escaped first.
function md(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of String(text).split('\n')) {
    let mm;
    if ((mm = line.match(/^\s*#{1,4}\s+(.*)/))) { close(); out.push(`<h4>${inline(mm[1])}</h4>`); }
    else if ((mm = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(mm[1])}</li>`); }
    else if ((mm = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(mm[1])}</li>`); }
    else if (!line.trim()) { close(); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join('');
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Everything below about the corpus comes from the API: /api/library (PDFs + modes) and /api/suggestions.
const modeLabel = m => !m || m === 'none' ? 'Fast' : m.replace(/_/g, '-').replace(/^./, c => c.toUpperCase());
const docLabel = n => n.replace(/\.pdf$/i, '').replace(/[-_]+/g, ' ');
let library = null, suggestions = null;

async function loadLibrary() {
  try { library = await api('/api/library'); } catch { library = {documents: [], modes: ['none']}; }
  const keep = $('mode').value;
  $('mode').innerHTML = library.modes.map(m => `<option value="${esc(m)}">${esc(modeLabel(m))}</option>`).join('');
  if (library.modes.includes(keep)) $('mode').value = keep;
  const n = library.documents.length;
  if (n) $('tagline').textContent = `${n} document${n > 1 ? 's' : ''} indexed`;
  renderStarter();
}

async function loadSuggestions() {
  try { suggestions = await api('/api/suggestions'); } catch { suggestions = []; }
  renderStarter();
}

function toggleDrawer(open) { document.body.classList.toggle('drawer', open); }

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

async function loadChats() {
  try {
    const chats = await api('/api/chats');
    $('chats').innerHTML = chats.length ? chats.map(c =>
      `<div class="chat-item ${c.id === chatId ? 'active' : ''}" onclick="openChat(${c.id})">
         <span>${esc(c.title)}</span><button class="del" title="Delete chat" onclick="event.stopPropagation(); delChat(${c.id})">✕</button></div>`).join('')
      : '<div class="no-chats">No chats yet — ask your first question.</div>';
  } catch {
    $('chats').innerHTML = '<div class="no-chats">Couldn’t reach the server.</div>';
  }
}

function showEmpty() {
  $('messages').innerHTML = `<div class="empty">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--brand-soft)"/><path d="M16 26V14" stroke="var(--bark)" stroke-width="2" stroke-linecap="round"/><path d="M16 15c-5 0-8-3-8-8 5 0 8 3 8 8Zm0 2c4 0 7-2.5 7-7-4 0-7 2.5-7 7Z" fill="var(--brand)"/></svg>
    <h1>What would you like to know?</h1>
    <p>Answers come straight from your PDFs, with the pages they were found on.</p>
    <div class="suggestions"></div>
    <div class="library"></div>
  </div>`;
  renderStarter();
}

function renderStarter() {
  const box = $('messages').querySelector('.empty');
  if (!box) return;
  const sug = box.querySelector('.suggestions');
  if (suggestions === null) sug.innerHTML = '<div class="skeleton"></div>'.repeat(4);
  else {
    sug.innerHTML = suggestions.map(q => `<button type="button">${esc(q)}</button>`).join('');
    sug.querySelectorAll('button').forEach(b => b.onclick = () => { $('q').value = b.textContent; $('form').requestSubmit(); });
  }
  const docs = library?.documents || [];
  box.querySelector('.library').innerHTML = docs.length ? `<h2>Your library</h2><ul>${docs.map(d =>
    `<li title="${esc(d.name)}">${esc(docLabel(d.name))} <em>· ${d.pages} p</em></li>`).join('')}</ul>` : '';
}

function render(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + m.role;
  if (m.role === 'assistant') div.innerHTML = md(m.content); else div.textContent = m.content;
  if (m.role === 'assistant') {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<span class="chip">${esc(modeLabel(m.mode))}</span>` +
      (m.latency_ms != null ? `<span class="chip">${(m.latency_ms / 1000).toFixed(2)}s</span>` : '');
    div.appendChild(meta);
    if (m.sources && m.sources.length) {
      const d = document.createElement('details');
      d.innerHTML = `<summary>${m.sources.length} source${m.sources.length > 1 ? 's' : ''}</summary>` + m.sources.map((s, i) =>
        `<p class="src"><b>[${i + 1}] ${esc(s.source)}</b> <em>· p.${s.page + 1} · score ${s.score}</em><br>${esc(s.preview)}…</p>`).join('');
      div.appendChild(d);
    }
  }
  $('messages').querySelector('.empty')?.remove();
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
  return div;
}

function typing() {
  const div = render({role: 'assistant', content: ''});
  div.querySelector('.meta')?.remove();
  div.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  return div;
}

async function openChat(id) {
  chatId = id;
  toggleDrawer(false);
  $('messages').innerHTML = '';
  (await api(`/api/chats/${id}/messages`)).forEach(render);
  loadChats();
}

function newChat() {
  chatId = null;
  toggleDrawer(false);
  showEmpty();
  loadChats();
  $('q').focus();
}

async function delChat(id) {
  await api(`/api/chats/${id}`, {method: 'DELETE'});
  if (id === chatId) newChat(); else loadChats();
}

function autosize() { const t = $('q'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }

$('form').onsubmit = async e => {
  e.preventDefault();
  const question = $('q').value.trim();
  if (!question) return;
  const send = $('form').querySelector('.send');
  $('q').value = ''; autosize(); send.disabled = true;
  render({role: 'user', content: question});
  const pending = typing();
  const mode = $('mode').value;
  try {
    const r = await api('/api/chat', {method: 'POST', body: JSON.stringify({question, chat_id: chatId, mode})});
    pending.remove();
    render({role: 'assistant', content: r.answer, mode, latency_ms: r.latency_ms, sources: r.sources});
    if (chatId === null) { chatId = r.chat_id; }
    loadChats();
  } catch (err) {
    pending.innerHTML = `<span class="error">Error: ${esc(err.message)}</span>`;
  } finally {
    send.disabled = false;
  }
};
$('q').addEventListener('input', autosize);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
showEmpty();
loadChats();
loadLibrary();
loadSuggestions();
</script>
</body>
</html>
