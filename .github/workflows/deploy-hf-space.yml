# Deploys the app to a free Hugging Face Docker Space on every push to main.
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN      a Hugging Face access token with "Write" permission
#   secret   GROQ_API_KEY  your Groq key (copied into the Space as a secret)
#   variable HF_SPACE      e.g. your-hf-username/raggeneral  (created automatically if missing)
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "huggingface_hub>=0.25"

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python .github/scripts/deploy_hf_space.py
