<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #f6f7f9; color: #1d1f23; }
  aside { width: 250px; background: #fff; border-right: 1px solid #e3e5e8; display: flex; flex-direction: column; }
  aside button.new { margin: 12px; padding: 10px; border: 0; border-radius: 8px; background: #2f6fed; color: #fff; cursor: pointer; }
  #chats { overflow-y: auto; flex: 1; }
  .chat-item { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; font-size: 14px; }
  .chat-item:hover, .chat-item.active { background: #eef3ff; }
  .chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .del { border: 0; background: none; color: #999; cursor: pointer; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 760px; margin: 0 auto 14px; padding: 12px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; }
  .user { background: #2f6fed; color: #fff; margin-left: auto; max-width: 600px; }
  .assistant { background: #fff; border: 1px solid #e3e5e8; }
  .meta { font-size: 12px; color: #6b7078; margin-top: 8px; }
  details { font-size: 12px; margin-top: 6px; color: #444; }
  form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid #e3e5e8; background: #fff; }
  textarea { flex: 1; resize: none; padding: 10px; border: 1px solid #ccd; border-radius: 8px; font: inherit; }
  select, form button { padding: 0 12px; border-radius: 8px; border: 1px solid #ccd; font: inherit; }
  form button { background: #2f6fed; color: #fff; border: 0; cursor: pointer; }
  .empty { color: #888; text-align: center; margin-top: 30vh; }
  @media (max-width: 700px) { aside { display: none; } }
</style>
</head>
<body>
<aside>
  <button class="new" onclick="newChat()">+ New chat</button>
  <div id="chats"></div>
</aside>
<main>
  <div id="messages"><div class="empty">Ask a question about your PDFs</div></div>
  <form id="form">
    <textarea id="q" rows="2" placeholder="Ask something... (Enter to send, Shift+Enter for newline)"></textarea>
    <select id="mode" title="Query rewriting (more accurate, slower)">
      <option value="none">No rewrite (fastest)</option>
      <option value="rewrite">Rewrite</option>
      <option value="multi_query">Multi-query</option>
      <option value="hyde">HyDE</option>
    </select>
    <button type="submit">Send</button>
  </form>
</main>
<script>
let chatId = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

async function loadChats() {
  const chats = await api('/api/chats');
  $('chats').innerHTML = chats.map(c =>
    `<div class="chat-item ${c.id === chatId ? 'active' : ''}" onclick="openChat(${c.id})">
       <span>${esc(c.title)}</span><button class="del" onclick="event.stopPropagation(); delChat(${c.id})">✕</button></div>`).join('');
}

function render(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + m.role;
  div.textContent = m.content;
  if (m.role === 'assistant') {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `mode: ${m.mode || 'none'}` + (m.latency_ms != null ? ` · ${(m.latency_ms / 1000).toFixed(2)}s` : '');
    div.appendChild(meta);
    if (m.sources && m.sources.length) {
      const d = document.createElement('details');
      d.innerHTML = '<summary>Sources</summary>' + m.sources.map((s, i) =>
        `<p><b>[${i + 1}] ${esc(s.source)} p.${s.page + 1}</b> (score ${s.score})<br>${esc(s.preview)}…</p>`).join('');
      div.appendChild(d);
    }
  }
  $('messages').querySelector('.empty')?.remove();
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
  return div;
}

async function openChat(id) {
  chatId = id;
  $('messages').innerHTML = '';
  (await api(`/api/chats/${id}/messages`)).forEach(render);
  loadChats();
}

function newChat() {
  chatId = null;
  $('messages').innerHTML = '<div class="empty">Ask a question about your PDFs</div>';
  loadChats();
}

async function delChat(id) {
  await api(`/api/chats/${id}`, {method: 'DELETE'});
  if (id === chatId) newChat(); else loadChats();
}

$('form').onsubmit = async e => {
  e.preventDefault();
  const question = $('q').value.trim();
  if (!question) return;
  $('q').value = '';
  render({role: 'user', content: question});
  const pending = render({role: 'assistant', content: 'Thinking…'});
  try {
    const r = await api('/api/chat', {method: 'POST', body: JSON.stringify({question, chat_id: chatId, mode: $('mode').value})});
    pending.remove();
    render({role: 'assistant', content: r.answer, mode: $('mode').value, latency_ms: r.latency_ms, sources: r.sources});
    if (chatId === null) { chatId = r.chat_id; }
    loadChats();
  } catch (err) {
    pending.textContent = 'Error: ' + err.message;
  }
};
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); } });
loadChats();
</script>
</body>
</html>
